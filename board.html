<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenWrite · 实时故事板</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6f8; color: #2c3e50; }
  header { display: flex; align-items: baseline; gap: 16px; padding: 12px 20px; background: #fff;
           border-bottom: 1px solid #e3e6ea; }
  header h1 { font-size: 17px; margin: 0; }
  #refresh-info { font-size: 12px; color: #8a94a6; }
  main { display: flex; height: calc(100vh - 53px); }
  aside { width: 380px; min-width: 320px; background: #fff; border-right: 1px solid #e3e6ea;
          display: flex; flex-direction: column; }
  .stats { padding: 12px 14px; border-bottom: 1px solid #eef0f3; }
  .totals { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .totals div { font-size: 13px; color: #5b6b7f; display: flex; justify-content: space-between; }
  .totals b { font-size: 15px; color: #2c3e50; }
  .totals .wechat b { color: #07914a; }
  .totals .rednote b { color: #d81e37; }
  .pies { display: flex; gap: 12px; }
  .pies figure { flex: 1; margin: 0; min-width: 0; }
  .pies svg { width: 100%; max-width: 120px; height: auto; display: block; margin: 0 auto; }
  .pies figcaption { font-size: 11px; color: #8a94a6; text-align: center; margin: 4px 0 6px; }
  .legend { display: flex; flex-direction: column; gap: 3px; }
  .legend-row { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #5b6b7f; }
  .legend-row .swatch { width: 9px; height: 9px; border-radius: 2px; flex: none; }
  .legend-row .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-row .legend-val { color: #98a2b3; flex: none; }
  .legend-empty { font-size: 11px; color: #98a2b3; text-align: center; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 10px 12px;
             border-bottom: 1px solid #eef0f3; }
  .filters select, .filters input { font-size: 12px; padding: 4px 6px; border: 1px solid #d5dae1;
          border-radius: 4px; background: #fff; color: #2c3e50; width: 100%; }
  .filters select { grid-column: 1 / -1; }
  #task-list { flex: 1; overflow-y: auto; }
  .task { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; cursor: pointer; border-left: 3px solid transparent; }
  .task:hover { background: #f7f9fc; }
  .task.selected { background: #e8f1fb; border-left-color: #1a6db5; }
  .task-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; word-break: break-all; }
  .task-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 9px; background: #eef1f5; color: #5b6b7f; }
  .badge.overall-generating { background: #e8f1fb; color: #1a6db5; }
  .badge.overall-pending-publish { background: #fff7e6; color: #ad6800; }
  .badge.overall-published { background: #e6f7ec; color: #07914a; }
  .badge.overall-ungenerated { background: #eef1f5; color: #5b6b7f; }
  .task-date { font-size: 11px; color: #98a2b3; margin-left: auto; }
  .bar-track { height: 4px; background: #edf0f3; border-radius: 2px; overflow: hidden; }
  .bar-fill { height: 100%; background: #1a6db5; border-radius: 2px; }
  .bar-fill.full { background: #07c160; }
  .task-status { font-size: 11px; color: #8a94a6; margin-top: 4px; }
  .task-status .ok { color: #07914a; }
  .task-status .warn { color: #d97706; }
  .task-status .err { color: #d81e37; }
  #pagination { display: flex; align-items: center; justify-content: space-between; gap: 8px;
                padding: 8px 12px; border-top: 1px solid #e3e6ea; font-size: 12px; color: #5b6b7f; }
  #pagination button { font-size: 12px; padding: 4px 10px; border: 1px solid #d5dae1; border-radius: 4px;
                       background: #fff; cursor: pointer; color: #2c3e50; }
  #pagination button:disabled { opacity: .4; cursor: default; }
  #right { flex: 1; overflow-y: auto; padding: 24px 28px; }
  #board-empty, .empty-box { border: 1px dashed #cfd6de; border-radius: 8px; padding: 40px 20px;
                             text-align: center; color: #98a2b3; font-size: 13px; background: #fbfcfd; }
  #board-title { margin: 0 0 8px; font-size: 22px; word-break: break-all; }
  #board-subtitle { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  #board-subtitle .chip { font-size: 12px; background: #fff; border: 1px solid #e3e6ea;
                          padding: 3px 10px; border-radius: 12px; color: #5b6b7f; }
  #board-subtitle .chip.overall-generating { background: #e8f1fb; border-color: #9ec5e8; color: #1a6db5; }
  #board-subtitle .chip.overall-pending-publish { background: #fff7e6; border-color: #ffd591; color: #ad6800; }
  #board-subtitle .chip.overall-published { background: #e6f7ec; border-color: #b7ebc9; color: #07914a; }
  #board-subtitle .chip.overall-ungenerated { background: #eef1f5; border-color: #d5dae1; color: #5b6b7f; }
  .banner { font-size: 13px; padding: 8px 12px; border-radius: 6px; margin-bottom: 14px; }
  .banner.warn { background: #fff7e6; border: 1px solid #ffd591; color: #ad6800; }
  .banner.err { background: #fff1f0; border: 1px solid #ffa39e; color: #cf1322; }
  #steps { display: flex; margin: 18px 0 26px; }
  .step { flex: 1; text-align: center; position: relative; }
  .step::before { content: ""; position: absolute; top: 14px; left: -50%; width: 100%; height: 2px;
                  background: #dfe3e8; z-index: 0; }
  .step:first-child::before { display: none; }
  .step.done::before, .step.current::before, .step.stale::before { background: #9ec5e8; }
  .dot { width: 28px; height: 28px; border-radius: 50%; margin: 0 auto 6px; line-height: 26px;
         font-size: 13px; background: #fff; border: 2px solid #dfe3e8; color: #98a2b3;
         position: relative; z-index: 1; }
  .step.done .dot { background: #07c160; border-color: #07c160; color: #fff; }
  .step.current .dot { border-color: #1a6db5; color: #1a6db5; font-weight: 700;
                       box-shadow: 0 0 0 4px rgba(26,109,181,.15); }
  .step.stale .dot { background: #fa8c16; border-color: #fa8c16; color: #fff; }
  .step-label { font-size: 11px; color: #5b6b7f; padding: 0 2px; }
  .step.current .step-label { color: #1a6db5; font-weight: 600; }
  #right h3 { font-size: 14px; margin: 0 0 12px; color: #5b6b7f; }
  #thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
  #thumbs figure { margin: 0; background: #fff; border: 1px solid #e3e6ea; border-radius: 8px;
                   padding: 8px; }
  #thumbs img { width: 100%; display: block; border-radius: 4px; background: #f0f2f5; }
  #thumbs figcaption { font-size: 11px; color: #8a94a6; margin-top: 6px; text-align: center;
                       word-break: break-all; }
  .missing { border: 1px dashed #ffa39e; border-radius: 4px; padding: 24px 8px; text-align: center;
             color: #cf1322; font-size: 12px; }
  .note-box { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px; padding: 14px 16px;
              margin-top: 16px; font-size: 13px; line-height: 1.8; white-space: pre-wrap; }
  .note-box .topics { margin-top: 8px; color: #1a6db5; font-size: 12px; }
  #html-toggle { margin-top: 16px; font-size: 12px; padding: 5px 12px; border: 1px solid #d5dae1;
                 border-radius: 4px; background: #fff; cursor: pointer; color: #2c3e50; }
  #html-frame { width: 100%; height: 600px; border: 1px solid #e3e6ea; border-radius: 8px;
                background: #fff; margin-top: 10px; }
</style>
</head>
<body>
<header>
  <h1>OpenWrite · 实时故事板</h1>
  <span id="refresh-info">每 2 秒自动刷新 · 只读</span>
</header>
<main>
  <aside>
    <div class="stats">
      <div class="totals">
        <div class="wechat"><span>已创建微信公众号任务</span><b id="total-wechat">0</b></div>
        <div class="rednote"><span>已创建小红书图文任务</span><b id="total-rednote">0</b></div>
      </div>
      <div class="pies">
        <figure>
          <svg id="pie-wechat" viewBox="0 0 100 100" role="img" aria-label="微信账号占比"></svg>
          <figcaption>微信 · 账号占比</figcaption>
          <div class="legend" id="legend-wechat"></div>
        </figure>
        <figure>
          <svg id="pie-rednote" viewBox="0 0 100 100" role="img" aria-label="小红书账号占比"></svg>
          <figcaption>小红书 · 账号占比</figcaption>
          <div class="legend" id="legend-rednote"></div>
        </figure>
      </div>
    </div>
    <div class="filters">
      <select id="platform-filter" title="选择平台">
        <option value="wechat">微信公众号</option>
        <option value="rednote">小红书</option>
      </select>
      <select id="account-filter" title="选择账号">
        <option value="">全部账号</option>
      </select>
      <input type="date" id="date-from" title="创建日期起" value="1990-01-01">
      <input type="date" id="date-to" title="创建日期止">
    </div>
    <div id="task-list"></div>
    <div id="pagination">
      <button id="prev">上一页</button>
      <span id="page-info"></span>
      <button id="next">下一页</button>
    </div>
  </aside>
  <section id="right">
    <div id="board-empty">从左侧选择一个任务，查看创作看板</div>
    <div id="board" hidden>
      <h2 id="board-title"></h2>
      <div id="board-subtitle"></div>
      <div id="board-banner"></div>
      <div id="steps"></div>
      <h3>交付件</h3>
      <div id="deliverables"></div>
    </div>
  </section>
</main>
<script>
'use strict';
const localToday = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
};
const state = { page: 1, platform: 'wechat', account: null, from: '1990-01-01', to: localToday(),
                selected: null, listJson: '', detailJson: '', statsJson: '', busy: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const PALETTE = ['#1a6db5', '#07c160', '#fa8c16', '#d81e37', '#722ed1',
                 '#13c2c2', '#eb2f96', '#a0d911', '#faad14', '#5b6b7f'];

async function fetchJSON(url) {
  const response = await fetch(url, { cache: 'no-store' });
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}

function taskQuery() {
  const params = new URLSearchParams({ page: state.page, platform: state.platform });
  if (state.account) params.set('account', state.account);
  if (state.from) params.set('from', state.from);
  if (state.to) params.set('to', state.to);
  return '/api/tasks?' + params.toString();
}

function pieSVG(items) {
  const total = items.reduce((sum, item) => sum + item.count, 0);
  if (!total) return '<text x="50" y="55" text-anchor="middle" font-size="11" fill="#98a2b3">暂无</text>';
  const cx = 50, cy = 50, r = 45;
  let angle = -Math.PI / 2, paths = '';
  items.forEach((item, index) => {
    const frac = item.count / total;
    const color = PALETTE[index % PALETTE.length];
    if (frac >= 0.9999) {
      paths += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"/>`;
    } else {
      const a2 = angle + frac * 2 * Math.PI;
      const x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      const x2 = cx + r * Math.cos(a2), y2 = cy + r * Math.sin(a2);
      const large = frac > 0.5 ? 1 : 0;
      paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} `
             + `A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${color}"/>`;
      angle = a2;
    }
  });
  return paths;
}

function legendHTML(items) {
  const total = items.reduce((sum, item) => sum + item.count, 0);
  if (!total) return '<div class="legend-empty">暂无任务</div>';
  return items.map((item, index) => {
    const pct = Math.round(item.count / total * 100);
    return `<div class="legend-row" title="${esc(item.label)}">
      <span class="swatch" style="background:${PALETTE[index % PALETTE.length]}"></span>
      <span class="legend-label">${esc(item.label)}</span>
      <span class="legend-val">${item.count} · ${pct}%</span></div>`;
  }).join('');
}

function syncAccountOptions(options) {
  const select = $('account-filter');
  const signature = JSON.stringify(options);
  if (select.dataset.sig !== signature) {
    select.dataset.sig = signature;
    select.innerHTML = '<option value="">全部账号</option>'
      + options.map((o) => `<option value="${esc(o.key)}">${esc(o.label)}</option>`).join('');
  }
  if (state.account === null) state.account = options.length ? options[0].key : '';
  select.value = state.account;
  if (select.value !== state.account) { select.value = ''; state.account = ''; }
}

function renderStats(data) {
  $('total-wechat').textContent = data.totals.wechat;
  $('total-rednote').textContent = data.totals.rednote;
  for (const platform of ['wechat', 'rednote']) {
    const items = data.breakdown[platform] || [];
    $('pie-' + platform).innerHTML = pieSVG(items);
    $('legend-' + platform).innerHTML = legendHTML(items);
  }
  syncAccountOptions(data.account_options[state.platform] || []);
}

async function refreshStats() {
  const data = await fetchJSON('/api/stats');
  const json = JSON.stringify(data);
  if (json !== state.statsJson) {
    state.statsJson = json;
    renderStats(data);
  } else {
    syncAccountOptions(data.account_options[state.platform] || []);
  }
}

function statusText(item) {
  if (item.error) return `<span class="err">${esc(item.error)}</span>`;
  if (item.stale) return `<span class="warn">⚠ ${esc(item.stale)} 步产物已过期</span>`;
  if (item.completed) return '<span class="ok">✓ 可发布</span>';
  return `${item.done}/${item.total} 步`;
}

function renderList(data) {
  $('task-list').innerHTML = data.items.map((item) => `
    <div class="task ${item.name === state.selected ? 'selected' : ''}" data-name="${esc(item.name)}">
      <div class="task-title">${esc(item.title)}</div>
      <div class="task-meta">
        <span class="badge overall-${esc(item.overall)}">${esc(item.overall_label)}</span>
        ${item.perspective_label ? `<span class="badge">${esc(item.perspective_label)}</span>` : ''}
        <span class="task-date">${esc((item.created_at || '').slice(0, 10))}</span>
      </div>
      <div class="bar-track"><div class="bar-fill ${item.completed ? 'full' : ''}"
           style="width:${Math.round(item.done / item.total * 100)}%"></div></div>
      <div class="task-status">${statusText(item)}</div>
    </div>`).join('') || '<div class="empty-box" style="margin:12px">没有符合条件的任务</div>';
  $('page-info').textContent = `第 ${data.page}/${data.pages} 页 · 共 ${data.total} 个`;
  $('prev').disabled = data.page <= 1;
  $('next').disabled = data.page >= data.pages;
}

function renderSteps(steps) {
  $('steps').innerHTML = steps.map((step) => {
    const mark = step.status === 'done' ? '✓' : step.status === 'stale' ? '!' : (step.mark || step.ordinal);
    const tip = step.note ? ` title="${esc(step.note)}"` : '';
    return `<div class="step ${step.status}"${tip}>
      <div class="dot">${mark}</div><div class="step-label">${esc(step.label)}</div></div>`;
  }).join('');
}

function renderDeliverables(detail) {
  const box = $('deliverables');
  if (!detail.deliverables) {
    box.innerHTML = `<div class="empty-box">任务尚未完成，交付件将在七步完成后显示。<br>
      当前进度：${detail.done}/${detail.total} 步${detail.error ? '（' + esc(detail.error) + '）' : ''}</div>`;
    return;
  }
  const d = detail.deliverables;
  let html = '<div id="thumbs">';
  let contentIndex = 0;
  for (const image of d.images) {
    const label = image.role === 'cover' ? '封面' :
      (detail.platform === 'rednote' ? `卡片 ${++contentIndex + 1}` : `配图 ${++contentIndex}`);
    html += image.exists
      ? `<figure><img src="/files/${esc(detail.name)}/${esc(image.file)}" alt="${esc(label)}" loading="lazy">
         <figcaption>${esc(label)} · ${esc(image.file)}</figcaption></figure>`
      : `<figure><div class="missing">缺失：${esc(image.file)}</div>
         <figcaption>${esc(label)}</figcaption></figure>`;
  }
  html += '</div>';
  if (d.note) {
    html += `<div class="note-box">${esc(d.note.desc)}
      ${d.note.topics.length ? `<div class="topics">话题：${d.note.topics.map(esc).join(' · ')}</div>` : ''}</div>`;
  }
  if (d.html) {
    html += `<button id="html-toggle">预览排版 HTML</button>
             <iframe id="html-frame" src="/files/${esc(detail.name)}/${esc(d.html)}" hidden></iframe>`;
  }
  box.innerHTML = html;
  const toggle = $('html-toggle');
  if (toggle) toggle.addEventListener('click', () => {
    const frame = $('html-frame');
    frame.hidden = !frame.hidden;
    toggle.textContent = frame.hidden ? '预览排版 HTML' : '收起排版预览';
  });
}

function renderDetail(detail) {
  $('board-empty').hidden = true;
  $('board').hidden = false;
  $('board-title').textContent = detail.title;
  $('board-subtitle').innerHTML = [
    detail.overall_label && `状态：${detail.overall_label}`,
    detail.platform_label && `平台：${detail.platform_label}`,
    detail.account && `账号：${detail.account}`,
    detail.topic && `主题：${detail.topic}`,
    detail.perspective_label && `视角：${detail.perspective_label}`,
  ].filter(Boolean).map((text, index) =>
    `<span class="chip${index === 0 ? ' overall-' + esc(detail.overall) : ''}">${esc(text)}</span>`).join('');
  const banner = $('board-banner');
  if (detail.error) banner.innerHTML = `<div class="banner err">${esc(detail.error)}</div>`;
  else if (detail.stale) banner.innerHTML =
    `<div class="banner warn">⚠ 步骤 ${esc(detail.stale)} 的产物已变化，需 workflow reset --from ${esc(detail.stale)} 后重做。</div>`;
  else banner.innerHTML = '';
  renderSteps(detail.steps);
  renderDeliverables(detail);
}

async function refreshList() {
  const data = await fetchJSON(taskQuery());
  state.page = data.page;
  const json = JSON.stringify(data);
  if (json !== state.listJson) {
    state.listJson = json;
    renderList(data);
  }
  if (!state.selected && data.items.length) select(data.items[0].name);
}

async function refreshDetail() {
  if (!state.selected) return;
  try {
    const detail = await fetchJSON('/api/task/' + encodeURIComponent(state.selected));
    const json = JSON.stringify(detail);
    if (json !== state.detailJson) {
      state.detailJson = json;
      renderDetail(detail);
    }
  } catch (error) {
    $('board-empty').hidden = false;
    $('board').hidden = true;
    $('board-empty').textContent = '加载失败：' + error.message;
  }
}

function select(name) {
  state.selected = name;
  state.detailJson = '';
  document.querySelectorAll('.task').forEach((node) =>
    node.classList.toggle('selected', node.dataset.name === name));
  refreshDetail();
}

async function tick() {
  if (state.busy) return;
  state.busy = true;
  try {
    await refreshStats();
    await refreshList();
    await refreshDetail();
    $('refresh-info').textContent =
      '每 2 秒自动刷新 · 最后更新 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
  } catch (error) {
    $('refresh-info').textContent = '刷新失败：' + error.message;
  } finally {
    state.busy = false;
  }
}

$('task-list').addEventListener('click', (event) => {
  const node = event.target.closest('.task');
  if (node) select(node.dataset.name);
});
$('prev').addEventListener('click', () => { state.page -= 1; state.listJson = ''; tick(); });
$('next').addEventListener('click', () => { state.page += 1; state.listJson = ''; tick(); });
$('platform-filter').addEventListener('change', (event) => {
  state.platform = event.target.value;
  state.account = null;            // 切换平台后重新默认该平台第一个账号
  state.page = 1; state.listJson = ''; state.statsJson = '';
  tick();
});
$('account-filter').addEventListener('change', (event) => {
  state.account = event.target.value; state.page = 1; state.listJson = ''; tick();
});
$('date-from').addEventListener('change', (event) => {
  state.from = event.target.value; state.page = 1; state.listJson = ''; tick();
});
$('date-to').addEventListener('change', (event) => {
  state.to = event.target.value; state.page = 1; state.listJson = ''; tick();
});

$('platform-filter').value = state.platform;
$('date-from').value = state.from;
$('date-to').value = state.to;
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
