name: 左文右图·暖色人物
description: 奶油白到浅杏橙柔和渐变、右侧贴底生活插画、左侧品牌大标题与多行卖点和小标语
layout_aliases: [左文右图, left-text-right-image]

visual_style: 温暖柔和的编辑人物插画
color_tone: 奶油白到浅杏橙的连续渐变

background:
  type: gradient
  rule: >-
    smooth continuous warm gradient background across the whole image, cream ivory
    on the left blending softly into light apricot orange on the right; no hard split,
    no separate text panel, no dark scrim, no accent lines or decorative horizontal rules

subject:
  region: right
  width_ratio: 0.5
  scene: >-
    ONE cohesive friendly everyday editorial illustration matching the article's actual subject,
    such as a person using a laptop at a wooden desk with a coffee cup and green plant;
    use only a few topic-relevant floating visual elements, never a fixed unrelated video-editing scene
  fit: >-
    a grounded scene naturally extending to the bottom edge; the desk, furniture or foreground
    may be cropped by the bottom canvas edge, not a small floating vignette; keep the face and
    key objects fully visible and reserve the left text area without overlap

text:
  region: left
  width_ratio: 0.45
  position: center-left
  positions: [top-left, center-left, bottom-left]
  scrim: false
  levels: [title, subtitle, tagline]
  guidance: >-
    stays quiet and uncluttered for a bold brand or topic headline, a substantial multiline
    Chinese benefit statement and a small muted tagline, all aligned to the same left edge
  overlay_defaults:
    effect: warm-editorial
    font_size: 62
    subtitle_size: 44
    tagline_size: 22
    margin_ratio: 0.047
    title_subtitle_gap: 52
    subtitle_tagline_gap: 48
    line_gap: 10
    vertical_offset: 0
    color: '#583720'
    subtitle_color: '#483326'
    tagline_color: '#928571'

acceptance:
  - 奶油白到浅杏橙平滑渐变，无硬切、独立面板或暗色遮罩
  - 右侧生活场景贴底，允许桌面或前景延伸至底边，人物脸部和关键物件完整
  - 左侧大标题、多行卖点、小标语三级清晰，文字实际左边缘对齐且不压右侧主体
  - 英文品牌与中文卖点各用合适粗体，字色深棕，标语暖灰；不发光、不描边、不画装饰横线
  - 底图不含任何文字，主体按文章内容选择，不机械复制参考图题材
