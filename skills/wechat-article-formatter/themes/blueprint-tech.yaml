name: 蓝图科技
description: 蓝紫主色 + 淡蓝/绿/粉红辅色，适合技术科普、工程方法论、架构与流程讲解。强调"同结构同色"——一级章节统一蓝底白字、引用块统一绿色、表格统一蓝底白字斑马行；绿色与粉红仅作语义色（绿=正向/正确，粉红=警告/反例）。

# ─── 设计铁律 ────────────────────────────────────────────────
# 1. 同种结构在同一篇文章中必须使用同一种颜色：
#    - 所有一级章节标题（h1）：蓝底白字、纯色（不用渐变）
#    - 所有引用/重点条目块（blockquote）：绿色左边线 + 淡绿底
#    - 所有表格表头：蓝底白字，数据行白/淡蓝斑马
# 2. 绿色与粉红是"语义色"，不是装饰色：
#    - 绿色 = 正向、成功、推荐做法（默认 blockquote 即为此色）
#    - 粉红 = 警告、反例、陷阱（作者按需在 inline 强调或自建 div 中使用）
# 3. 禁止：同一篇文章里把 h1 写成蓝底然后又写成红底；禁止 blockquote 在三种颜色间反复横跳。
# ─────────────────────────────────────────────────────────────

variables:
  # 主色（蓝紫）—— 用于一级标题底色、表头底色、链接外观
  primary-color: "#667eea"
  # 正文强调色（深蓝灰）—— 用于 h2/h3 文字与左边线、strong 加粗、inline code 文字
  primary-color-deep: "#1f4e79"

  # 语义辅色
  accent-positive: "#2e8b8b"             # 青色（teal）：引用块左边线 / 正向语义
  accent-positive-bg: "#f0fff4"          # 淡绿底（与青色 teal 同冷色系，视觉协调）
  accent-warning: "#f5576c"              # 粉红：警告 / 反例（语义提示用）
  accent-warning-bg: "#fff5f5"           # 淡粉底

  # 中性背景层（淡蓝色调）
  bg-soft: "#f8f9ff"                     # 表格偶数行 / 代码 inline 底色
  bg-soft-2: "#f0f2ff"                   # 更浅一档蓝灰底

  # 文本
  text-color: "#333333"
  text-light: "#555555"
  text-muted: "#999999"

styles:
  # ── 标题层级 ──
  # h1：一级章节大标题——蓝底白字、纯色不渐变、左对齐块状
  h1: "display:block; font-size:18px; font-weight:bold; color:#ffffff; background:{primary-color}; padding:10px 18px; border-radius:6px; margin:2em 0 1em; letter-spacing:1px; line-height:1.5;"
  # h2：二级——主色左边线 + 主色文字，低调但与 h1 同色系，避免抢色
  h2: "font-size:17px; font-weight:bold; color:{primary-color-deep}; padding:4px 0 4px 12px; border-left:4px solid {primary-color}; margin:1.6em 0 0.8em; line-height:1.5;"
  # h3：三级——纯主色文字加粗，无底色
  h3: "font-size:16px; font-weight:bold; color:{primary-color-deep}; margin:1.3em 0 0.6em;"
  # h4：四级——深灰加粗，不抢色
  h4: "font-size:15px; font-weight:bold; color:#444444; margin:1.1em 0 0.5em;"

  # ── 正文 ──
  p: "font-size:16px; line-height:1.85; color:{text-color}; margin:0.8em 0; letter-spacing:0.3px;"

  # ── 行内元素 ──
  strong: "color:{primary-color-deep}; font-weight:bold;"
  em: "font-style:italic; color:{text-light};"
  a: "color:{primary-color}; text-decoration:none; border-bottom:1px solid {primary-color};"
  code: "color:{primary-color-deep}; background:{bg-soft-2}; padding:2px 6px; border-radius:3px; font-size:90%; font-family:Consolas, Monaco, monospace;"
  del: "text-decoration:line-through; color:{text-muted};"

  # ── 引用块（重点条目）——统一绿色左边线 + 淡绿底 ──
  blockquote: "border-left:4px solid {accent-positive}; background:{accent-positive-bg}; padding:12px 16px; margin:1.2em 0; color:{text-light}; border-radius:0 4px 4px 0;"

  # ── 列表 ──
  ul: "padding-left:22px; margin:0.8em 0;"
  ol: "padding-left:22px; margin:0.8em 0;"
  li: "margin-bottom:6px; line-height:1.8; color:{text-color};"

  # ── 分割线 ──
  hr: "border:none; height:1px; background:linear-gradient(to right, rgba(102,126,234,0), rgba(102,126,234,0.5), rgba(102,126,234,0)); margin:2em 0;"

  # ── 图片 ──
  img: "max-width:100%; border-radius:6px; display:block; margin:0 auto; box-shadow:0 6px 16px rgba(102,126,234,0.18);"
  figcaption: "text-align:center; font-size:13px; color:{text-muted}; margin-top:8px;"

  # ── 代码块——浅底深字，与整体浅色调一致 ──
  pre: "background:#f5f7fa; color:#2d3748; padding:16px; border-radius:8px; font-size:13px; line-height:1.75; overflow-x:auto; border:1px solid #e2e8f0; box-shadow:0 2px 6px rgba(102,126,234,0.06);"

  # ── 表格——表头蓝底白字，数据行白/淡蓝斑马，单元格全边框形成内部网格 + 外框 ──
  # 边框色 #e0e3ff 与主色 #667eea 同色系，淡蓝紫，参考自示例公众号文章
  table: "width:100%; border-collapse:collapse; margin:1.4em 0; font-size:14px; box-shadow:0 2px 8px rgba(102,126,234,0.08);"
  th: "background:{primary-color}; color:#ffffff; padding:10px 14px; text-align:center; font-weight:bold; border:1px solid #e0e3ff;"
  td: "padding:9px 14px; border:1px solid #e0e3ff; text-align:center; color:{text-color};"
  tr-head: ""                            # 表头行整行样式（th 已自带底色，这里留空）
  tr-odd: "background:#ffffff;"          # 数据行第 1、3、5... 行
  tr-even: "background:{bg-soft};"       # 数据行第 2、4、6... 行（淡蓝）

  # ── 加粗强调色变量（供 strong 复用） ──
  strong-color: "{primary-color-deep}"
